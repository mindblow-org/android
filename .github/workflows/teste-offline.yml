name: teste-offline

on:
  push:
    branches: [valb-mig/servidor-local]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teste-offline
  cancel-in-progress: true

jobs:
  apk:
    name: apk offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/checkout@v7
        with:
          repository: mindblow-org/desktop
          ref: ${{ vars.MINDBLOW_REF || 'main' }}
          path: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: cargo-ndk e NDK
        run: |
          cargo install cargo-ndk --locked
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "MINDBLOW_SRC=$GITHUB_WORKSPACE/desktop" >> "$GITHUB_ENV"

      - name: chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::falta o secret ANDROID_KEYSTORE (veja o README)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MINDBLOW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: compilar
        env:
          MINDBLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINDBLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINDBLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleOffline

      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/offline/app-offline.apk mindblow-android-offline.apk
          cat > notes.md <<EOF
          Versão de teste do app com o servidor junto e o sync, da branch \`$BRANCH\` (${GITHUB_SHA::7}). Não é uma release: é refeita a cada push.

          Baixe o \`mindblow-android-offline.apk\` no celular. Ele instala ao lado do app normal e do "mindblow teste", como **mindblow offline**, e guarda as notas no próprio celular. Para sincronizar, toque no QR do canto de cima, em "ler QR", e leia o QR de um mindblow com sync (a main do desktop).
          EOF
          gh release delete teste-offline --cleanup-tag --yes 2>/dev/null || true
          gh release create teste-offline mindblow-android-offline.apk --prerelease --latest=false --target "$GITHUB_SHA" --title "mindblow android offline (teste)" --notes-file notes.md
