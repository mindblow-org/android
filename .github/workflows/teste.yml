name: teste

# APK de teste de cada branch de trabalho. Instala ao lado do app normal, como "mindblow teste",
# e sai numa pré-release única, "teste", trocada a cada push. Release de verdade continua só na branch release.
on:
  push:
    branches-ignore: [main, release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teste
  cancel-in-progress: true

jobs:
  apk:
    name: apk de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::falta o secret ANDROID_KEYSTORE (veja o README)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MINDBLOW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: compilar
        env:
          MINDBLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINDBLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINDBLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleBeta

      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/beta/app-beta.apk mindblow-android-teste.apk
          cat > notes.md <<EOF
          Versão de teste da branch \`$BRANCH\` (${GITHUB_SHA::7}). Não é uma release: some e volta a cada push numa branch de trabalho.

          Baixe o \`mindblow-android-teste.apk\` no celular. Ele instala ao lado do app normal, como **mindblow teste**, com link e token próprios, então dá para apontar para um servidor de teste sem mexer no app de todo dia.
          EOF
          gh release delete teste --cleanup-tag --yes 2>/dev/null || true
          gh release create teste mindblow-android-teste.apk --prerelease --latest=false --target "$GITHUB_SHA" --title "mindblow android teste" --notes-file notes.md
