name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: versão do gradle.properties
        id: version
        run: |
          v=$(sed -n 's/^version=//p' gradle.properties)
          [ -n "$v" ] || { echo "::error::versão não encontrada em gradle.properties"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: conferir a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG já foi publicada. Suba a versão em gradle.properties antes de dar push na release."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # O servidor que vai dentro do app (libmindblow.so) vem do repo do desktop.
      # MINDBLOW_REF (variável do repositório) escolhe a versão; sem ela, a main.
      - uses: actions/checkout@v7
        with:
          repository: mindblow-org/desktop
          ref: ${{ vars.MINDBLOW_REF || 'main' }}
          path: desktop

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: cargo-ndk e NDK
        run: |
          cargo install cargo-ndk --locked
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "MINDBLOW_SRC=$GITHUB_WORKSPACE/desktop" >> "$GITHUB_ENV"

      - name: chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::falta o secret ANDROID_KEYSTORE (veja o README)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MINDBLOW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: compilar
        env:
          MINDBLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINDBLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINDBLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mindblow-android.apk
          cat > notes.md <<'EOF'
          Baixe o `mindblow-android.apk` no celular e instale (o Android pede para liberar a instalação pelo navegador na primeira vez). O app guarda as notas no próprio celular e funciona sem internet. Para sincronizar com outro aparelho, toque no QR do canto de cima, em "ler QR", e leia o QR do mindblow do PC.

          O sync precisa de um [mindblow](https://github.com/mindblow-org/desktop) com sync do outro lado; um servidor mais antigo aparece como "mindblow sem sync".
          EOF
          gh release create "$TAG" mindblow-android.apk --target "$GITHUB_SHA" --title "mindblow android $TAG" --notes-file notes.md --generate-notes --latest
