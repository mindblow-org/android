name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: versão do gradle.properties
        id: version
        run: |
          v=$(sed -n 's/^version=//p' gradle.properties)
          [ -n "$v" ] || { echo "::error::versão não encontrada em gradle.properties"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: conferir a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG já foi publicada. Suba a versão em gradle.properties antes de dar push na release."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::falta o secret ANDROID_KEYSTORE (veja o README)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MINDBLOW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: compilar
        env:
          MINDBLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MINDBLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MINDBLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk mindblow-android.apk
          cat > notes.md <<'EOF'
          Baixe o `mindblow-android.apk` no celular e instale (o Android pede para liberar a instalação pelo navegador na primeira vez). Para conectar, abra o mindblow em outro aparelho, toque no QR do canto de cima e leia o código no app.

          Atalhos, widget, abrir a nota compartilhada e o botão voltar dependem de um [mindblow](https://github.com/mindblow-org/mindblow) com os ganchos do app (`#new=`, `#open=` e `mindblowBack`).
          EOF
          gh release create "$TAG" mindblow-android.apk --target "$GITHUB_SHA" --title "mindblow android $TAG" --notes-file notes.md --generate-notes --latest
